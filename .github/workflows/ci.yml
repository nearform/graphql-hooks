name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Dispatched against the release branch because pushes made with GITHUB_TOKEN do not trigger pull_request runs.
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package.json') }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm install
      - run: npm run lint
      - run: npm run test:coverage -- --silent
      - run: npm run check-types
      - run: npm run build
      # Its suite is mocha, which test:coverage (jest) does not run, and it needs
      # the build above for the tests that load the built lib.
      - run: npm test --workspace=babel-plugin-extract-gql
      # graphql-hooks-ssr supports React 18 and 19, but its unit tests only run on
      # the workspace's 19, so render a real app against each.
      - run: node packages/graphql-hooks-ssr/test-react/smoke.js 18
      - run: node packages/graphql-hooks-ssr/test-react/smoke.js 19
      - uses: coverallsapp/github-action@v2.3.8
        if: github.event_name != 'workflow_dispatch'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
